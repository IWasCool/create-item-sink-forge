[[mods]]
modId="item_sink"
version="${mod_version}"
displayName="Create: Item Sink"
displayURL="https://github.com/IWasCool/create-item-sink-forge"
authors="Izcool"
description='''
A configurable Create addon that converts unwanted items into currency.
Numismatics is optional; the default configuration uses its coins.
Other currency items can be configured in
item_sink-common.toml.
'''

[[dependencies.item_sink]]
modId="forge"
mandatory=true
versionRange="[47.4.0,48)"
ordering="NONE"
side="BOTH"

